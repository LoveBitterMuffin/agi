name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Verify zero Python bytecode artifacts
        run: |
          artifacts=$(find . -path './.git' -prune -o \( -name '__pycache__' -o -name '*.pyc' \) -print)
          if [ -n "$artifacts" ]; then
            echo "Found forbidden Python bytecode artifacts:"
            echo "$artifacts"
            exit 1
          fi

      - name: Run Node.js test suite
        run: node --test tests/tool-chain-hooks.test.mjs tests/agi-manifest.test.mjs

      - name: Run Ponytail restraint hook audit
        run: node hooks/audit-restraint.mjs hooks

      - name: Package release archives and SHA256SUMS
        run: |
          stage_dir="${RUNNER_TEMP}/agi-stage"
          dist_dir="${GITHUB_WORKSPACE}/dist"
          rm -rf "$stage_dir" "$dist_dir"
          mkdir -p "$stage_dir" "$dist_dir"

          rsync -a \
            --exclude='/.git' \
            --exclude='/.github' \
            --exclude='/dist' \
            --exclude='/scratch' \
            --exclude='/memory/harness_incidents.json' \
            --exclude='__pycache__' \
            --exclude='*.pyc' \
            ./ "$stage_dir/"

          tar -C "$stage_dir" -czf "$dist_dir/agi-${{ github.ref_name }}.tar.gz" .
          (cd "$stage_dir" && zip -rq "$dist_dir/agi-${{ github.ref_name }}.zip" .)
          (
            cd "$dist_dir"
            sha256sum "agi-${{ github.ref_name }}.tar.gz" "agi-${{ github.ref_name }}.zip" > SHA256SUMS.txt
            cat SHA256SUMS.txt
          )

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/agi-${{ github.ref_name }}.tar.gz
            dist/agi-${{ github.ref_name }}.zip
            dist/SHA256SUMS.txt
